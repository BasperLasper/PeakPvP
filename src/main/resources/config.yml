config-version: 4

messages:
  prefix: '&b&lPEAK &8» &f'

world:
  name: pvp
  spawn-y: 66
  spawn-protection-radius: 50
  spawn-protection-y: 65

spawn-build:
  enabled: true
  duration-seconds: 60

arena-rules:
  allow-block-breaking: false
  allow-fire-spread: false

chat:
  format: '<prefix>&f<name><suffix> &8» &f<message>'
  tab-name: '<prefix>&f<name><suffix> &7<ping>ms'
  tab-header: '\n&b&lPeakMC\n&cServer Duels\n'
  tab-footer: '\n&fOnline: &b<online> &7| &fNetwork: &b<network-online>&7\n&fpeaksmp.us/discord\n'
  update-ticks: 100
  network-player-count: true
  mentions:
    enabled: true
    highlight-color: '&e'
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.8
    pitch: 1.4

scoreboard:
  enabled: true
  title: '&b&lPRACTICE'
  update-ticks: 20
  lines:
    - ''
    - '&7In Fights: &f0'
    - '&7Queuing: &f0'
    - '&7Ping: &f<ping>ms'
    - ''
    - '&7Kills: &f<kills>'
    - '&7Deaths: &f<deaths>'
    - '&71.8 ELO: &e<legacy-elo>'
    - '&7Latest ELO: &b<latest-elo>'
    - '&7Area: &b<area-color><area>'
    - ''
    - '&7&opeaksmp.us'

lobby-items:
  enabled: true
  unranked:
    slot: 0
    material: IRON_SWORD
    name: '&e&lRanked 1.8'
    lore: ['&7Play competitive 1.8 duels.', '&fCombat: &e1.8 PvP', '&fRating: &e1.8 ELO', '', '&eRight-click to open']
  ranked:
    slot: 1
    material: DIAMOND_SWORD
    name: '&b&lRanked Latest'
    lore: ['&7Play competitive duels.', '&fCombat: &bLatest PvP', '&fRating: &bLatest ELO', '', '&eRight-click to open']
  quick-join:
    slot: 2
    material: COMPASS
    name: '&d&lQuick Join'
    lore: ['&7Wait for either matchmaking mode.', '&fJoins the first kit another player selects.', '', '&eRight-click to queue']
  party:
    slot: 4
    material: ENDER_EYE
    name: '&d&lCreate Party'
    lore: ['&7Create or manage a party.', '', '&eRight-click to open']
  kit-editor:
    slot: 7
    material: BOOK
    name: '&b&lKit Editor'
    lore: ['&7Edit your duel loadouts.', '', '&eRight-click to open']
  settings:
    slot: 8
    material: CLOCK
    name: '&e&lSettings'
    lore: ['&7Change your preferences.', '', '&eRight-click to open']

auto-messages:
  enabled: true
  interval-seconds: 180
  messages:
    - '&8&m--------------------------------\n&c&lDUELS &8» &fChallenge another player and prove who is best!\n&8&m--------------------------------'
    - '&8&m--------------------------------\n&c&lKITS &8» &fChoose a kit and jump into the fight.\n&8&m--------------------------------'
    - '&8&m--------------------------------\n&c&lSPAWN &8» &fPvP is disabled within &c50 blocks &fof spawn above Y 65.\n&8&m--------------------------------'
